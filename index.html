<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDM CVP for GN — Dashboard</title>
<style>
:root{
  --o:#FF5515; --o-2:#FF8A4C; --o-3:#FFB38A; --o-4:#FFD9C2;
  --d:#111222; --d-2:#4A4A55; --d-3:#8C8C99; --d-4:#BFBFC7;
  --bg:#EDEDF1; --page:#F5F5F7; --card:#FFFFFF; --line:#E9E9EE; --grid:#F2F2F5;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);
  font-family:"Segoe UI","Segoe UI Web (West European)",-apple-system,system-ui,sans-serif;
  color:var(--d);font-size:13px;-webkit-font-smoothing:antialiased}
.frame{max-width:1440px;margin:22px auto;background:var(--page);border-radius:14px;
  box-shadow:0 1px 3px rgba(17,18,34,.06),0 12px 32px rgba(17,18,34,.08);
  display:grid;grid-template-columns:146px 1fr;overflow:hidden;min-height:820px}
@media(max-width:820px){.frame{grid-template-columns:1fr}}

aside{background:var(--card);border-right:1px solid var(--line);padding:16px 0;
  display:flex;flex-direction:column}
.mark{margin:2px 16px 26px;font-size:10.5px;font-weight:700;line-height:1.35;
  color:var(--d);letter-spacing:.2px}
aside nav{display:flex;flex-direction:column}
aside nav button{appearance:none;border:0;background:none;font:inherit;font-size:11.5px;
  color:var(--d-3);text-align:left;padding:9px 14px 9px 16px;cursor:pointer;
  border-left:3px solid transparent;line-height:1.35}
aside nav button:hover{color:var(--d-2);background:var(--page)}
aside nav button[aria-current="true"]{color:var(--o);font-weight:600;
  border-left-color:var(--o);background:#FFF6F2}
aside nav button:focus-visible{outline:2px solid var(--o);outline-offset:-2px}
aside .by{margin-top:auto;padding:0 16px;font-size:8.5px;color:var(--d-4);
  font-style:italic;line-height:1.5}

main{padding:20px 24px 26px;min-width:0}

/* ---------- cover ---------- */
.cover {
  position: relative;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  margin-bottom: 11px;
  min-height: 700px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 60px;
  overflow: hidden;
}
.cv-bg {
  position: absolute;
  top: 0; right: 0; bottom: 0; left: 0;
  overflow: hidden;
  pointer-events: none;
}
.cv-bg .solid {
  position: absolute;
  top: -40%; right: -15%;
  width: 900px; height: 900px;
  background: #FF0000;
  border-radius: 50%;
}
.cv-bg .ring {
  position: absolute;
  border-radius: 50%;
  border: 1px solid rgba(0,0,0,0.06);
}
.cv-bg .ring.r1 { top: -45%; right: -20%; width: 1000px; height: 1000px; }
.cv-bg .ring.r2 { top: -50%; right: -25%; width: 1100px; height: 1100px; }
.cv-bg .ring.r3 { top: -55%; right: -30%; width: 1200px; height: 1200px; }
.cv-logo {
  position: absolute;
  top: 50px; right: 50px;
  width: 140px; height: 45px;
  z-index: 10;
}

.cv-main {
  position: relative;
  z-index: 10;
  max-width: 700px;
  padding: 0;
}
.cv-main .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 3px; color: var(--d-2); text-transform: uppercase; }
.cv-main .rule { width: 45px; height: 4px; background: #FF0000; margin: 16px 0 24px; }
.cv-main h2 { margin: 0; font-size: 46px; line-height: 1.15; font-weight: 700; letter-spacing: -1px; color: #111222; }
.cv-main .prog { margin: 24px 0 0; font-size: 14px; color: var(--d-2); }

@media(max-width:820px){
  .cover { min-height: 500px; padding: 40px; }
  .cv-main h2 { font-size: 32px; }
  .cv-bg .solid { top: -20%; right: -30%; width: 500px; height: 500px; }
  .cv-bg .ring { display: none; }
  .cv-logo { top: 30px; right: 30px; width: 112px; height: 36px; }
}

/* ---------- slicer panel: dropdown multi-select ---------- */
.fbar{background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:9px 12px;margin-bottom:9px}
.fbar[hidden]{display:none}
.fbar .fhead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.fbar .fhead h4{margin:0;font-size:10px;font-weight:700;letter-spacing:1.2px;color:var(--d-2)}
.fstat{margin-left:auto;font-size:10px;color:var(--d-2);font-variant-numeric:tabular-nums}
.fstat b{color:var(--o)}
.freset{appearance:none;border:1px solid var(--line);background:var(--page);border-radius:6px;
  font:inherit;font-size:9.5px;font-weight:600;color:var(--d-2);padding:3px 9px;cursor:pointer}
.freset:hover{border-color:var(--o);color:var(--o)}
.freset[hidden]{display:none}
.slicers{display:grid;grid-template-columns:1.15fr 1.15fr .7fr;gap:9px}
@media(max-width:980px){.slicers{grid-template-columns:1fr 1fr}}
@media(max-width:700px){.slicers{grid-template-columns:1fr}}

/* kepala dropdown */
.sl{position:relative;min-width:0}
.sl-btn{appearance:none;width:100%;display:flex;align-items:center;gap:8px;font:inherit;
  border:1px solid var(--line);border-radius:8px;background:var(--page);
  padding:5px 9px 6px 10px;cursor:pointer;text-align:left;min-width:0}
.sl-btn:hover{border-color:var(--o-3);background:var(--card)}
.sl.open .sl-btn{background:var(--card);border-color:var(--o);box-shadow:0 0 0 2px #FFE7DB}
.sl-btn:focus-visible{outline:2px solid var(--o);outline-offset:1px}
.sl-btn .txt{flex:1;min-width:0}
.sl-btn .lbl{display:block;font-size:8.5px;font-weight:700;letter-spacing:.7px;
  text-transform:uppercase;color:var(--d-3);line-height:1.2}
.sl-btn .val{display:block;margin-top:2px;font-size:11px;font-weight:600;color:var(--d);
  line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sl-btn .val.off{color:var(--d-3);font-weight:500}
.sl-btn .car{flex:0 0 auto;width:0;height:0;margin-top:4px;
  border-left:4px solid transparent;border-right:4px solid transparent;
  border-top:5px solid var(--d-3);transition:transform .18s ease}
.sl.open .sl-btn .car{transform:rotate(180deg);border-top-color:var(--o)}

/* panel opsi: animasi buka-tutup */
.sl-pop{position:absolute;z-index:40;top:calc(100% + 4px);left:0;right:0;
  background:var(--card);border:1px solid var(--line);border-radius:8px;
  box-shadow:0 10px 26px rgba(17,18,34,.16);overflow:hidden;
  opacity:0;visibility:hidden;transform:translateY(-6px) scaleY(.96);transform-origin:top;
  transition:opacity .18s ease,transform .18s ease,visibility .18s}
.sl.open .sl-pop{opacity:1;visibility:visible;transform:translateY(0) scaleY(1)}
@media(prefers-reduced-motion:reduce){
  .sl-pop{transition:none}.sl-btn .car{transition:none}}
.sl-list{max-height:198px;overflow-y:auto;padding:4px 0 5px}

/* baris opsi = checkbox (multi-select) */
.sl-i{display:flex;align-items:center;gap:8px;padding:4px 10px;font-size:10.5px;
  color:var(--d-2);cursor:pointer;line-height:1.4}
.sl-i:hover{background:#FFF6F2}
.sl-i input{appearance:none;flex:0 0 auto;width:12px;height:12px;margin:0;border-radius:2px;
  border:1px solid var(--d-4);background:var(--card);cursor:pointer;position:relative}
.sl-i input:checked{background:var(--o);border-color:var(--o)}
.sl-i input:checked::after{content:"";position:absolute;left:3px;top:.5px;width:4px;height:7px;
  border:solid #fff;border-width:0 1.5px 1.5px 0;transform:rotate(42deg)}
.sl-i input:focus-visible{outline:2px solid var(--o);outline-offset:1px}
.sl-i span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sl-i b{font-size:9.5px;font-weight:600;color:var(--d-4);font-variant-numeric:tabular-nums}
.sl-i.sel{color:var(--o);font-weight:600}
.sl-i.sel b{color:var(--o-2)}
.sl-i.dis{opacity:.38;cursor:default}
.sl-i.dis input{cursor:default}
.sl-all{border-bottom:1px solid var(--grid);margin-bottom:3px;padding-bottom:6px;
  font-size:10px;color:var(--d-3)}
.sl-all.sel{color:var(--o)}

.top{display:flex;align-items:flex-start;gap:14px;margin-bottom:16px}
.top h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.2px}
.top .sub{font-size:9.5px;color:var(--d-3);font-style:italic;margin-top:2px}

.params{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-bottom:11px}
@media(max-width:1100px){.params{grid-template-columns:repeat(3,1fr)}}
@media(max-width:700px){.params{grid-template-columns:repeat(2,1fr)}}
.params.p4{grid-template-columns:repeat(4,1fr)}
.pm{background:var(--page);border:1px solid var(--line);border-radius:9px;
  padding:9px 11px 13px;text-align:center}
.pm .tab{background:var(--card);border:1px solid var(--line);border-radius:6px;
  font-size:10px;font-weight:600;color:var(--d-2);padding:5px 6px;margin-bottom:9px;
  line-height:1.25}
.pm .big{font-size:29px;font-weight:700;line-height:1.05;letter-spacing:-.5px;
  font-variant-numeric:tabular-nums}
.pm .big.sm{font-size:19px}
.pm .big .u{font-size:15px;color:var(--d-3);font-weight:700}
.pm .base{font-size:8.5px;color:var(--d-3);margin-top:5px;line-height:1.35}

.row{display:grid;gap:9px;margin-bottom:9px}
.r-1{grid-template-columns:1fr}
.r-2{grid-template-columns:1fr 1fr}
.r-3{grid-template-columns:1fr 1fr 1fr}
.r-21{grid-template-columns:1.62fr 1fr}
.r-12{grid-template-columns:1fr 1.62fr}
@media(max-width:1100px){.r-2,.r-3,.r-21,.r-12{grid-template-columns:1fr}}
.c{background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:15px;position:relative;min-width:0;
  display:flex;flex-direction:column;height:100%}
.c h3{margin:0;font-size:12.5px;font-weight:600;line-height:1.3;padding-right:70px;flex:0 0 auto}
.c .st{font-size:9px;color:var(--d-3);font-style:italic;margin:2px 0 12px;flex:0 0 auto}
/* isi kartu membentang menutupi ruang yang tadinya dipakai catatan */
.c>.hb{flex:1;align-content:space-between}
.c>.dn{flex:1}
.c>.fnl{flex:1;justify-content:space-between}
.c>.vb{flex:1;min-height:0}
.c>table{flex:0 0 auto}
.c>.sw{flex:0 0 auto}
.tbl-tag{position:absolute;top:11px;right:12px;background:#FFF1EA;color:#B03D06;
  border-radius:4px;padding:1px 6px;font-size:8.5px;font-weight:700;letter-spacing:.3px}

.hb{display:grid;grid-template-columns:auto 1fr;gap:7px 10px;align-items:center}
.hb.tight{gap:4px 10px}
.hb .k{font-size:10.5px;color:var(--d-2);text-align:right;line-height:1.25}
.hb .b{position:relative;height:17px;display:flex;align-items:center}
.hb .b i{display:block;height:17px;border-radius:3px;background:var(--o);min-width:2px}
.hb .b i.g{background:var(--d-4)} .hb .b i.dk{background:var(--d)}
.hb .b i.l{background:var(--o-3)} .hb .b i.ll{background:var(--o-4)}
.hb .b span{font-size:10px;font-weight:600;margin-left:7px;white-space:nowrap;
  font-variant-numeric:tabular-nums}
.hb .b span em{font-style:normal;font-weight:400;color:var(--d-3);font-size:9px}

.fnl{display:flex;flex-direction:column;gap:6px}
.fnl .s{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px}
.fnl .bar{height:28px;border-radius:4px;background:var(--o);display:flex;align-items:center;
  padding-left:10px;color:#fff;font-size:10.5px;font-weight:600;white-space:nowrap;overflow:hidden}
.fnl .bar.f2{background:var(--o-2)} .fnl .bar.f3{background:var(--o-3);color:var(--d)}
.fnl .bar.f4{background:var(--o-4);color:var(--d)}
.fnl .n{font-size:10px;color:var(--d-3);white-space:nowrap;font-variant-numeric:tabular-nums}
.fnl .n em{font-style:normal;color:var(--d-4);font-size:9px}

.dn{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.dn .ring{width:126px;height:126px;border-radius:50%;flex:0 0 auto;position:relative;
  display:grid;place-items:center}
.dn .ring::after{content:"";position:absolute;inset:22px;background:var(--card);border-radius:50%}
.dn .ctr{position:relative;z-index:1;text-align:center}
.dn .ctr b{display:block;font-size:19px;font-weight:700;line-height:1}
.dn .ctr small{font-size:8.5px;color:var(--d-3)}
.dn ul{list-style:none;margin:0;padding:0;font-size:10.5px;min-width:150px;flex:1}
.dn li{display:flex;align-items:center;gap:7px;padding:3px 0;color:var(--d-2)}
.dn li i{width:9px;height:9px;border-radius:2px;flex:0 0 auto}
.dn li b{margin-left:auto;font-variant-numeric:tabular-nums}

table{width:100%;border-collapse:collapse;font-size:10.5px}
th{text-align:left;font-size:9px;font-weight:600;color:var(--d-3);padding:0 6px 7px;
  border-bottom:1px solid var(--line);line-height:1.3;vertical-align:bottom}
th.n,td.n{text-align:right;font-variant-numeric:tabular-nums}
th.ctr,td.ctr{text-align:center;font-variant-numeric:tabular-nums}
td{padding:6px 6px;border-bottom:1px solid var(--grid);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
td em{font-style:normal;color:var(--d-3)}
.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:9px;font-weight:600}
.pill.d{background:#EFEFF3;color:var(--d-2)}
.heat td.h{text-align:center;font-weight:600;font-size:9.5px;border-radius:3px;
  font-variant-numeric:tabular-nums}
.rng{position:relative;display:block;height:13px;background:var(--grid);border-radius:3px;
  min-width:60px}
.rng i{position:absolute;top:0;bottom:0;background:var(--o-3);border-radius:3px}
.rng u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--o);text-decoration:none}
.vb{list-style:none;margin:0;padding:0;max-height:232px;overflow-y:auto}
.vb li{font-size:10px;color:var(--d-2);line-height:1.5;padding:6px 2px 6px 10px;
  border-left:2px solid var(--o-4);border-bottom:1px solid var(--grid)}
.vb li:last-child{border-bottom:0}
.sw{display:flex;gap:14px;flex-wrap:wrap;font-size:9px;color:var(--d-3);margin:-4px 0 9px}
.sw span i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:4px;
  vertical-align:-1px}
.dq{display:inline-block;background:#FFF1EA;color:#B03D06;border-radius:3px;
  padding:1px 5px;font-size:8.5px;font-weight:700;letter-spacing:.2px}
.note{background:#FFF6F2;border:1px solid #FFE0D0;border-radius:9px;padding:11px 14px;
  font-size:10px;color:#8A3A0E;line-height:1.6;margin-bottom:11px}
.note b{color:#6B2A05}
.empty{background:var(--card);border:1px dashed var(--d-4);border-radius:10px;
  padding:34px 20px;text-align:center;font-size:11px;color:var(--d-3);line-height:1.7}
.pg{display:none} .pg.on{display:block}
/* cover mengisi tinggi area utama */
main{display:flex;flex-direction:column}
#pages{flex:1;display:flex;flex-direction:column}
#pages>.pg-cover.on{flex:1}
.pg.pg-cover .cover{margin-bottom:0}

/* ---------- grid kartu demografi ---------- */
.cv-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:9px}
/* gap 9px = konsisten dengan .row; ubah ke 20px bila ingin lebih lega */
.cv-grid.g3{grid-template-columns:repeat(3,1fr)}
.cv-grid>.c{height:100%}
.cv-grid>.c.sp2{grid-column:1/-1}
@media(max-width:1100px){.cv-grid,.cv-grid.g3{grid-template-columns:1fr}}

/* ---------- blok angka statistik ringkas di dalam kartu ---------- */
.dgs{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 10px;flex:0 0 auto}
.dgs>div{flex:1 1 0;min-width:88px;background:var(--page);border:1px solid var(--line);
  border-radius:8px;padding:8px 10px}
.dgs b{display:block;font-size:20px;font-weight:700;line-height:1.05;letter-spacing:-.3px;
  font-variant-numeric:tabular-nums}
.dgs b .u{font-size:11px;color:var(--d-3)}
.dgs small{display:block;margin-top:3px;font-size:8.5px;color:var(--d-3);line-height:1.35}

/* persen pada legenda donut */
.dn li em{font-style:normal;color:var(--d-3);font-size:9.5px;margin-left:3px}

/* ---------- ikon pada menu samping ---------- */
aside nav button{display:flex;align-items:center;gap:7px}
aside nav button svg{flex:0 0 auto;width:13px;height:13px;stroke:currentColor;fill:none;
  stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
</style>

    const num=i.n+(p!=null? ' <em>('+dec(p,1)+'%)</em>':'');
    return '<div class="s"><div class="bar '+(i.cls||f[Math.min(ix,4)])+'" style="width:'+
      w.toFixed(1)+'%">'+i.k+' &nbsp;·&nbsp; '+i.v+'</div><div class="n">'+num+'</div></div>';
  }).join('')+'</div>';
}
function tbl(head,body){return '<table>'+(head?'<thead>'+head+'</thead>':'')+'<tbody>'+body+'</tbody></table>';}
function kv(pairs){return tbl('',pairs.map(p=>'<tr><td>'+p[0]+'</td><td class="n">'+p[1]+'</td></tr>').join(''));}
function donut(a,b,la,lb,ctrLabel){
  const t=a+b, pa=t?a/t*100:0;
  return '<div class="dn"><div class="ring" style="background:conic-gradient(var(--o) 0 '+
    pa.toFixed(1)+'%,var(--d-4) '+pa.toFixed(1)+'% 100%)"><div class="ctr"><b>'+a+
    '</b><small>'+ctrLabel+'</small></div></div><ul><li><i style="background:var(--o)"></i>'+
    la+' <b>'+a+'</b></li><li><i style="background:var(--d-4)"></i>'+lb+' <b>'+b+'</b></li></ul></div>';
}
/* parameter fn (catatan interpretasi) sengaja tidak dirender lagi;
   signature dipertahankan agar seluruh pemanggilan card(...) tetap valid */
function card(tag,title,st,body,fn,cls){
  return '<div class="c'+(cls?' '+cls:'')+'">'+(tag?'<span class="tbl-tag">'+tag+'</span>':'')+
    '<h3>'+title+'</h3>'+(st?'<div class="st">'+st+'</div>':'')+body+'</div>';
}
const row = (cls,cards)=>'<div class="row '+cls+'">'+cards.join('')+'</div>';
function kpi(items,cls){
  return '<div class="params'+(cls?' '+cls:'')+'">'+items.map(i=>
    '<div class="pm"><div class="tab">'+i.t+'</div><div class="big'+(i.sm?' sm':'')+'">'+i.v+
    '</div>'+(i.b?'<div class="base">'+i.b+'</div>':'')+'</div>').join('')+'</div>';
}
function heatBg(v,n){
  if(n===0) return 'background:#FAFAFC;color:var(--d-3)';
  const r=v/n;
  if(r>=1) return 'background:#FAFAFC;color:var(--d-3)';
  if(r>=0.75) return 'background:#FFE9DC';
  if(r>=0.5) return 'background:#FFD0B5';
  return 'background:#FFB38A';
}
const SUBLBL=['Informasi lokasi distribusi','Dokumen yang dibutuhkan untuk pencairan',
  'Batasan barang yang boleh dibeli','Nilai cash GN yang akan diterima',
  'Kertas rencana belanja','Tahapan pencairan'];
const SUBSHORT=['Lokasi<br>distribusi','Dokumen<br>pencairan','Batasan<br>barang',
  'Nilai cash<br>GN','Kertas rencana<br>belanja','Tahapan<br>pencairan'];
const KEP5=['Sangat Puas','Puas','Biasa','Tidak Puas','Sangat Tidak Puas'];
const KEPVAL={'Sangat Tidak Puas':1,'Tidak Puas':2,'Biasa':3,'Puas':4,'Sangat Puas':5};
const NOSUG=/^(tidak\s*ada|tidak\s*tau|tidak\s*tahu|tidak\s*perlu|tidak$|sudah\s+(baik|bagus|sangat|berjalan)|untuk saat ini tidak|tidak ada yang)/i;
function verbatim(rows,key){
  const seen=new Map();
  rows.forEach(r=>{
    const t=(r[key]||'').trim();
    if(!t || NOSUG.test(t)) return;
    const k=t.toLowerCase();
    seen.set(k,{t:t,n:(seen.get(k)?seen.get(k).n+1:1)});
  });
  const list=[...seen.values()];
  if(!list.length) return '<div class="empty" style="padding:20px">Tidak ada jawaban berisi usulan pada seleksi ini.</div>';
  return '<ul class="vb">'+list.map(x=>'<li>'+esc(x.t)+
    (x.n>1?' <span class="pill d">'+x.n+'× identik</span>':'')+'</li>').join('')+'</ul>';
}
function noSugCount(rows,key){
  return rows.filter(r=>{const t=(r[key]||'').trim(); return !t || NOSUG.test(t);}).length;
}

/* ---------- filter state: MULTI-SELECT dropdown ---------- */
const SLICERS=[
  ['ap','Area Program',()=>AP_ALL],
  ['fsp','FSP yang dipakai',()=>FSP_ALL],
  ['lama','Pernah terima GN modalitas lama',()=>['Ya','Tidak']]
];
/* Set per kategori: boleh lebih dari satu nilai. Set kosong = tidak difilter */
const state={ap:new Set(),fsp:new Set(),lama:new Set()};
/* kotak dropdown mana yang sedang terbuka (satu per satu) */
let openSlicer=null;

const anyOn=()=>state.ap.size||state.fsp.size||state.lama.size;
function pass(r,skip){
  return (skip==='ap'   || state.ap.size===0   || state.ap.has(r.ap))   &&
         (skip==='fsp'  || state.fsp.size===0  || state.fsp.has(r.fsp)) &&
         (skip==='lama' || state.lama.size===0 || state.lama.has(r.lama));
}
function filtered(){ return DATA.filter(r=>pass(r)); }
function resetFilters(){
  state.ap.clear(); state.fsp.clear(); state.lama.clear(); openSlicer=null;
}
/* teks ringkas untuk kepala dropdown */
function slicerLabel(key){
  const s=state[key];
  if(s.size===0) return 'Semua';
  if(s.size===1) return [...s][0];
  return s.size+' dipilih';
}

/* Dropdown multi-select: kepala + panel checkbox yang muncul ke bawah */
function slicer(key,title,values){
  const sel=state[key], open=(openSlicer===key);
  const items=values.map(v=>({v:v,n:DATA.filter(r=>r[key]===v && pass(r,key)).length}));
  const allOn=(sel.size===0);

  let list='<div class="sl-list" data-f="'+key+'">';
  list+='<label class="sl-i sl-all'+(allOn?' sel':'')+'">'+
        '<input type="checkbox" data-all="1"'+(allOn?' checked':'')+'>'+
        '<span>(Pilih semua)</span><b>'+items.reduce((a,b)=>a+b.n,0)+'</b></label>';
  list+=items.map(i=>{
    const on=sel.has(i.v), dis=(i.n===0 && !on);
    return '<label class="sl-i'+(on?' sel':'')+(dis?' dis':'')+'">'+
      '<input type="checkbox" data-v="'+esc(i.v)+'"'+(on?' checked':'')+(dis?' disabled':'')+'>'+
      '<span title="'+esc(i.v)+'">'+esc(i.v)+'</span><b>'+i.n+'</b></label>';
  }).join('');
  list+='</div>';

  return '<div class="sl'+(open?' open':'')+'" data-sl="'+key+'">'+
    '<button type="button" class="sl-btn" data-toggle="'+key+'" aria-expanded="'+(open?'true':'false')+'">'+
      '<span class="txt"><span class="lbl">'+title+'</span>'+
      '<span class="val'+(sel.size?'':' off')+'">'+esc(slicerLabel(key))+'</span></span>'+
      '<span class="car"></span></button>'+
    '<div class="sl-pop">'+list+'</div></div>';
}
function buildFilters(){
  const R=filtered(), aps=new Set(R.map(r=>r.ap));
  $('slicers').innerHTML = SLICERS.map(([k,t,vals])=>slicer(k,t,vals())).join('');
  $('f-stat').innerHTML='<b>'+R.length+'</b> dari '+DATA.length+' RC \u00b7 '+aps.size+' AP';
  $('f-reset').hidden = !anyOn();
}

/* buka/tutup lewat class agar transisi CSS jalan (tanpa rebuild DOM) */
function setOpen(key){
  openSlicer=key;
  document.querySelectorAll('#slicers .sl').forEach(sl=>{
    const on=(sl.dataset.sl===key);
    sl.classList.toggle('open',on);
    const b=sl.querySelector('.sl-btn');
    if(b) b.setAttribute('aria-expanded',String(on));
  });
}
const closeSlicers=()=>setOpen(null);

/* klik kepala = toggle dropdown */
function onSlicerClick(e){
  const head=e.target.closest('.sl-btn');
  if(!head) return;
  e.stopPropagation();
  const key=head.dataset.toggle;
  setOpen(openSlicer===key ? null : key);
}
/* centang checkbox = tambah/kurangi nilai; dropdown tetap terbuka */
function onSlicerChange(e){
  const inp=e.target;
  if(!inp || inp.tagName!=='INPUT' || inp.disabled) return;
  const box=inp.closest('.sl-list'); if(!box) return;
  const key=box.dataset.f;
  if(inp.dataset.all){ state[key].clear(); }
  else {
    const v=inp.dataset.v;
    state[key].has(v) ? state[key].delete(v) : state[key].add(v);
  }
  render();                       // slicer() merender ulang dengan class .open tetap
}
/* klik di luar / Escape menutup dropdown */
document.addEventListener('click',e=>{
  if(openSlicer && !e.target.closest('.sl')) closeSlicers();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape' && openSlicer) closeSlicers();
});

  + '<div class="note"><b>Catatan pembacaan dua pertanyaan channel.</b> "Sumber aktual" berasal dari pertanyaan <i>Darimana Anda mendapat informasi?</i> (menanyakan <b>siapa</b>), sedangkan "preferensi" berasal dari <i>Bagaimana sebaiknya Anda menerima informasi?</i> (menanyakan <b>lewat cara apa</b>). Dua pertanyaan ini memakai daftar pilihan yang berbeda, sehingga tidak disandingkan sebagai satu grafik. Daftar preferensi tidak menyediakan opsi kader/PJI; responden menuliskannya sendiri di kolom "Lainnya" dan sudah direkode ke kategori Kader/PJI.</div>'
  + row('r-2',[
      card('TABEL 2','Sumber informasi yang diterima RC',
        'Multi-respons · basis '+n+' RC · pertanyaan "darimana Anda mendapat informasi"',
        hb([{k:'Kader perlindungan anak / PJI',v:srcKader,cls:'dk',lbl:of_(srcKader,n)},
            {k:'Staf WVI',v:srcStaf,cls:'dk',lbl:of_(srcStaf,n)},
            {k:'Pemerintah setempat',v:0,lbl:'0'}],{max:n}),
        'Termasuk RC yang memilih "Lainnya" dan menuliskan PJI; keduanya digabung dalam kategori Kader/PJI. Karena multi-respons, jumlah dapat melebihi n.'),
      card('TABEL 2','Channel informasi yang disukai RC',
        'Multi-respons · basis '+n+' RC · pertanyaan "bagaimana sebaiknya menerima informasi"',
        hb([{k:'Langsung dari staf',v:pStaf,lbl:of_(pStaf,n)},
            {k:'Kader / PJI / pendamping',v:pKader,lbl:of_(pKader,n)},
            {k:'Telepon / SMS / WhatsApp',v:pTelp,lbl:of_(pTelp,n)},
            {k:'Media sosial',v:pSos,lbl:of_(pSos,n)},
            {k:'Media cetak',v:pCetak,lbl:of_(pCetak,n)}],{max:n}),
        'Angka Kader/PJI seluruhnya berasal dari rekode teks "Lainnya". Untuk putaran survei berikutnya, opsi ini perlu masuk ke daftar pilihan agar tidak bergantung pada isian bebas.')
    ])
  + row('r-12',[
      card('TABEL 2','Staf WVI: sumber aktual dibanding preferensi',
        'Satu-satunya kategori yang tersedia di kedua pertanyaan · basis '+n+' RC',cross,
        'Tabel silang ini hanya berlaku untuk kategori staf WVI. Untuk kategori lain, pertanyaan aktual dan preferensi tidak punya opsi yang sepadan.'),
      card('TABEL 2','Sumber dan preferensi channel per AP','Jumlah RC · multi-respons',chTbl)
    ]);
}

function pg3(R){
  const n=R.length, aps=byAp(R);
  const fspD=dist(R,'fsp');
  const serah=dist(R,'serah');
  const mudah=C(R,r=>r.proses==='Mudah'), sulit=C(R,r=>r.proses==='Sulit');
  const sulitRows=R.filter(r=>r.proses==='Sulit');
  const KESULIT=['Jarak jauh','Jadwal bentrok','Jadwal molor','Antrian panjang','Info tidak jelas',
    'Tidak ada transport','Tidak ada pengantar','Lainnya'];
  const ks=multi(sulitRows,'kesulitan',KESULIT);
  const jarak=R.map(r=>r.jarak).filter(x=>x!=null);
  const kunj=R.map(r=>r.kunjungan).filter(x=>x!=null);
  const jam=R.map(r=>r.jam).filter(x=>x!=null);
  const potYa=C(R,r=>r.potongan==='Ya'), potNo=C(R,r=>r.potongan==='Tidak'),
        potTt=C(R,r=>r.potongan==='Tidak tahu');
  const potVals=R.filter(r=>r.potJml!=null).map(r=>r.potJml);
  const kepD=dist(R,'kepFsp',KEP5);
  const kepMean=(function(){const a=R.map(r=>KEPVAL[r.kepFsp]).filter(x=>x);
    return a.length?dec(a.reduce((x,y)=>x+y,0)/a.length,1):'—';})();
  const tdkPuasRows=R.filter(r=>r.kepFsp==='Biasa'||r.kepFsp==='Tidak Puas'||r.kepFsp==='Sangat Tidak Puas');
  const tp=multi(tdkPuasRows,'fspTdkPuas',['Jarak jauh','Biaya transport','Antrian panjang','Persyaratan sulit','Pelayanan tidak ramah']).filter(x=>x.v>0);

  const potTbl=tbl('<tr><th>Area Program</th><th class="ctr">n</th><th class="ctr">Ada</th>'+
    '<th class="ctr">Tidak</th><th class="ctr">Tidak<br>tahu</th><th class="n">Median<br>nominal</th>'+
    '<th class="n">Rentang<br>nominal</th></tr>',
    aps.slice().sort((a,b)=>C(b[1],r=>r.potongan==='Ya')-C(a[1],r=>r.potongan==='Ya'))
    .map(([a,rr])=>{
      const v=rr.filter(r=>r.potJml!=null).map(r=>r.potJml);
      return '<tr><td>'+esc(a)+'</td><td class="ctr">'+rr.length+'</td><td class="ctr">'+
        C(rr,r=>r.potongan==='Ya')+'</td><td class="ctr">'+C(rr,r=>r.potongan==='Tidak')+
        '</td><td class="ctr">'+C(rr,r=>r.potongan==='Tidak tahu')+'</td><td class="n">'+
        (v.length?rp(med(v)):'—')+'</td><td class="n">'+
        (v.length?(Math.min(...v)===Math.max(...v)?nf(Math.min(...v)):nf(Math.min(...v))+'–'+nf(Math.max(...v))):'—')+
        '</td></tr>';
    }).join('')+
    '<tr><td><b>Total seleksi</b></td><td class="ctr"><b>'+n+'</b></td><td class="ctr"><b>'+potYa+
    '</b></td><td class="ctr"><b>'+potNo+'</b></td><td class="ctr"><b>'+potTt+'</b></td><td class="n"><b>'+
    (potVals.length?rp(med(potVals)):'—')+'</b></td><td class="n"><b>'+
    (potVals.length?nf(Math.min(...potVals))+'–'+nf(Math.max(...potVals)):'—')+'</b></td></tr>');

  const jarakPerFsp=fspD.filter(f=>f.v>0).map(f=>{
    const v=R.filter(r=>r.fsp===f.k).map(r=>r.jarak).filter(x=>x!=null);
    return v.length? esc(f.k)+' '+med(v)+' km (maks '+Math.max(...v)+')':null;
  }).filter(Boolean).join(' · ');

  return kpi([
    {t:'Jenis FSP terpakai',v:fspD.filter(f=>f.v>0).length,b:'termasuk nama yang diisi di "Lainnya"'},
    {t:'Harus datang ke kantor FSP',v:C(R,r=>r.harusDatang==='Ya'),b:'dari '+n+' RC'},
    {t:'Jarak median ke FSP',v:jarak.length?med(jarak)+' km':'—',sm:true,
      b:jarak.length?'rentang '+Math.min(...jarak)+'–'+Math.max(...jarak)+' km · n='+jarak.length:'—'},
    {t:'Melaporkan ada potongan',v:potYa,b:'dari '+n+' RC · '+potTt+' menjawab tidak tahu'},
    {t:'Puas/sangat puas pelayanan FSP',v:C(R,r=>r.kepFsp==='Puas'||r.kepFsp==='Sangat Puas'),b:'dari '+n+' RC'}
  ])
  + row('r-2',[
      card('TABEL 3','FSP yang digunakan untuk mencairkan GN','Jumlah RC · basis '+n+' responden',
        hb(fspD.filter(f=>f.v>0).map(f=>({k:esc(f.k),v:f.v,
          cls:(f.k==='Bank lain'||f.k==='Tidak tahu/lupa')?'l':''})),{tight:true}),
        'Nama yang muncul di luar daftar baku berasal dari isian "Lainnya" yang sudah dipecah per lembaga. RC yang memilih "Bank lain" tanpa menyebut nama tidak dapat diatribusikan ke lembaga tertentu.'),
      card('TABEL 3','Siapa yang menyerahkan GN kepada RC','Jumlah RC · basis '+n+' responden',
        hb(['Petugas FSP','Petugas WVI','Petugas Kantor Desa','Petugas Kantor Kecamatan','Lainnya']
          .map(k=>({k:k,v:C(R,r=>r.serah===k),cls:k==='Lainnya'?'l':'',
            lbl:of_(C(R,r=>r.serah===k),n)})),{max:n}),
        'Keterangan yang ditulis pada "Lainnya": '+
        (R.filter(r=>r.serah==='Lainnya'&&r.serahLain).map(r=>esc(r.serahLain)).join(' · ')||'tidak ada isian')+'.')
    ])
  + row('r-3',[
      card('TABEL 4','Persepsi proses pemberian GN melalui FSP','Basis '+n+' responden',
        donut(mudah,sulit,'Mudah','Sulit','menjawab Mudah'),
        'Pertanyaan ini ditanyakan ke seluruh '+n+' RC, termasuk '+C(R,r=>r.harusDatang==='Tidak')+' RC yang tidak perlu datang ke kantor FSP.'),
      card('TABEL 4','Hal yang menyulitkan proses',
        'Multi-respons · basis '+sulit+' RC yang menjawab "Sulit"',
        sulit? kv(ks.filter(x=>x.v>0).map(x=>[x.k,x.v]).concat(
          ks.filter(x=>x.v===0).length?[[ks.filter(x=>x.v===0).map(x=>x.k).join(' · '),0]]:[]))
          : '<div class="empty" style="padding:20px">Tidak ada RC yang menjawab "Sulit" pada seleksi ini.</div>',
        'Basis kecil, sehingga ditampilkan sebagai hitungan mutlak dan tidak dipersentasekan.'
        + (sulitRows.some(r=>r.kesulitanLain)? ' Isian lainnya: '+sulitRows.filter(r=>r.kesulitanLain).map(r=>esc(r.kesulitanLain)).join(' · ')+'.':'')),
      card('TABEL 3','Aksesibilitas FSP','Median per indikator · basis '+n+' RC',
        kv([
          ['Jarak ke kantor FSP', jarak.length? med(jarak)+' km <em>('+Math.min(...jarak)+'–'+Math.max(...jarak)+')</em>':'—'],
          ['Jumlah kunjungan sampai selesai', kunj.length? med(kunj)+' × <em>('+Math.min(...kunj)+'–'+Math.max(...kunj)+')</em>':'—'],
          ['Waktu total pergi–pulang', jam.length? dec(med(jam),1).replace(',0','')+' jam <em>('+Math.min(...jam)+'–'+Math.max(...jam)+')</em>':'—'],
          ['Pernah pakai FSP ini sebelumnya', C(R,r=>r.pernahFsp==='Ya')+' / '+n],
          ['Dapat info tata cara pengambilan', C(R,r=>r.tatacara==='Ya')+' / '+n],
          ['Difasilitasi transport/pendamping', C(R,r=>r.difasilitasi==='Ya')+' / '+C(R,r=>r.harusDatang==='Ya')]
        ]),
        jarakPerFsp? 'Jarak median per FSP: '+jarakPerFsp+'.':'')
    ])
  + row('r-12',[
      card('TABEL 4','Transparansi potongan biaya',
        'Basis '+n+' responden · nominal dilaporkan '+potVals.length+' RC',
        hb([{k:'Tidak ada potongan',v:potNo,cls:'g',lbl:of_(potNo,n)},
            {k:'Ada potongan',v:potYa,lbl:of_(potYa,n)},
            {k:'Tidak tahu',v:potTt,cls:'l',lbl:of_(potTt,n)}],{max:n}),
        (potVals.length? 'Nominal yang dilaporkan berkisar '+rp(Math.min(...potVals))+' sampai '+
          rp(Math.max(...potVals))+' dengan median '+rp(med(potVals))+'. ':'')
        +'<b>'+potTt+' RC menjawab tidak tahu</b>, sehingga jumlah RC yang benar-benar dikenakan potongan belum dapat dipastikan dari survei saja.'),
      card('TABEL 4','Potongan biaya per Area Program',
        'Jumlah RC per jawaban dan median nominal yang dilaporkan',potTbl,
        'Median nominal dihitung hanya dari RC yang menjawab "ada potongan" dan mengisi nominal, sehingga basisnya sangat kecil per AP. Status potongan sebagai biaya FSP yang sah atau pengurangan yang tidak seharusnya memerlukan verifikasi Document Review.')
    ])
  + row('r-1',[card('TABEL 4','Kepuasan terhadap pelayanan FSP',
      'Basis '+n+' responden · skala 1–5',
      hb(kepD.map(d=>({k:d.k,v:d.v,cls:d.k==='Biasa'?'l':(d.k.indexOf('Tidak')>=0?'dk':''),
        lbl:of_(d.v,n)})),{max:n}),
      'Rata-rata '+kepMean+' dari 5.'+(tp.length? ' Alasan yang dipilih '+tdkPuasRows.length+
      ' RC yang menjawab biasa atau tidak puas: '+tp.map(x=>x.k.toLowerCase()+' ('+x.v+')').join(', ')+'.':''))]);
}

function pg4(R){
  const n=R.length, aps=byAp(R);
  const WB=['<5 hari','6-10 hari','11-15 hari','>15 hari setelah diinformasikan di awal','Lainnya'];
  const WBL=['&lt; 5 hari','6–10 hari','11–15 hari','&gt; 15 hari','Lainnya'];
  const trAll=R.map(r=>r.trans).filter(x=>x!=null);
  const trZero=trAll.filter(x=>x===0).length;
  const trSus=trAll.filter(x=>x>0&&x<1000);
  const trOk=trAll.filter(x=>x>=1000);
  const tca=R.filter(r=>r.trans!=null&&r.trans>=1000&&r.danaOk).map(r=>r.trans/r.dana*100);
  const hilangRp=R.filter(r=>r.hilang==='Ya'&&r.hilangRp!=null).map(r=>r.hilangRp);
  const CARA=['Bank','Tetap kantor pos','CU/Kopdit','Agen laku pandai (BRILink)','E-wallet (Ovo/Dana)',
    'Voucher','Barang langsung','Lainnya','Tidak menjawab'];
  const caraD=CARA.map(k=>({k:k,v:C(R,r=>r.caraPref===k)}));
  const lokD=dist(R,'lokasi');

  const dsTbl=tbl('<tr><th>Area Program</th><th class="ctr">n</th><th class="ctr">Sesuai</th><th class="ctr">Tidak sesuai</th></tr>',
    aps.slice().sort((a,b)=>C(b[1],r=>r.danaSesuai==='Tidak')-C(a[1],r=>r.danaSesuai==='Tidak'))
    .map(([a,rr])=>'<tr><td>'+esc(a)+'</td><td class="ctr">'+rr.length+'</td><td class="ctr">'+
      C(rr,r=>r.danaSesuai==='Ya')+'</td><td class="ctr">'+C(rr,r=>r.danaSesuai==='Tidak')+'</td></tr>').join('')+
    '<tr><td><b>Total seleksi</b></td><td class="ctr"><b>'+n+'</b></td><td class="ctr"><b>'+
    C(R,r=>r.danaSesuai==='Ya')+'</b></td><td class="ctr"><b>'+C(R,r=>r.danaSesuai==='Tidak')+'</b></td></tr>');

  const alasan=(function(){
    const rr=R.filter(r=>r.danaSesuai==='Tidak');
    if(!rr.length) return 'Tidak ada RC yang menjawab dana tidak sesuai pada seleksi ini.';
    const m={}; rr.forEach(r=>{const k=r.danaAlasan||'(tidak diisi)'; m[k]=(m[k]||0)+1;});
    const lain=rr.filter(r=>r.danaAlasanLain).map(r=>esc(r.danaAlasanLain)).join(' · ');
    return 'Penyebab yang dipilih '+rr.length+' RC yang menjawab tidak sesuai: '+
      Object.keys(m).map(k=>k.toLowerCase()+' ('+m[k]+')').join(', ')+
      (lain? '; isian lainnya: '+lain:'')+'. Ditampilkan agregat dan per AP tanpa dipasangkan dengan nama enumerator atau FSP.';
  })();

  const caraTbl=tbl('<tr><th>Area Program</th><th class="ctr">n</th>'+
    CARA.filter(k=>C(R,r=>r.caraPref===k)>0).map(k=>'<th class="ctr">'+esc(k).replace(/ /g,'<br>')+'</th>').join('')+'</tr>',
    aps.map(([a,rr])=>'<tr><td>'+esc(a)+'</td><td class="ctr">'+rr.length+'</td>'+
      CARA.filter(k=>C(R,r=>r.caraPref===k)>0).map(k=>'<td class="ctr">'+C(rr,r=>r.caraPref===k)+'</td>').join('')+
      '</tr>').join('')+
    '<tr><td><b>Total seleksi</b></td><td class="ctr"><b>'+n+'</b></td>'+
      CARA.filter(k=>C(R,r=>r.caraPref===k)>0).map(k=>'<td class="ctr"><b>'+C(R,r=>r.caraPref===k)+'</b></td>').join('')+'</tr>');

  return kpi([
    {t:'Dana sesuai informasi awal',v:C(R,r=>r.danaSesuai==='Ya'),b:'dari '+n+' RC'},
    {t:'Lokasi sesuai informasi awal',v:C(R,r=>r.lokasiSesuai==='Ya'),b:'dari '+n+' RC'},
    {t:'Merasa aman saat distribusi',v:C(R,r=>r.aman==='Ya'),b:'dari '+n+' RC'},
    {t:'Diperlakukan dengan hormat',v:C(R,r=>r.hormat==='Ya'),b:'dari '+n+' RC'},
    {t:'Biaya transport median',v:trOk.length?rp(med(trOk)):'—',sm:true,
      b:'basis '+trOk.length+' RC dengan nilai valid'}
  ])
  + row('r-2',[
      card('TABEL 5','Jarak waktu informasi sampai dana bisa diambil',
        'Persepsi RC · basis '+n+' responden',
        hb(WB.map((k,ix)=>({k:WBL[ix],v:C(R,r=>r.waktuInfo===k),
          cls:ix===3?'l':(ix===4?'ll':''),lbl:of_(C(R,r=>r.waktuInfo===k),n)})),{max:n}),
        (R.some(r=>r.waktuLain)? 'RC yang memilih "Lainnya" menuliskan: '+
          [...new Set(R.filter(r=>r.waktuLain).map(r=>r.waktuLain))].map(esc).join(' · ')+'. ':'')
        +'Angka ini berbasis persepsi RC. Pengukuran target Business Process 30 hari memerlukan Admin Data: tanggal instruksi transfer dan tanggal dana tersedia di FSP.'),
      card('TABEL 5','Kesesuaian dana yang diterima','Jumlah RC per AP · basis '+n+' responden',
        dsTbl,alasan)
    ])
  + row('r-3',[
      card('TABEL 6','Total Cost of Access — biaya transport',
        'Basis '+n+' RC · '+trOk.length+' nilai dipakai dalam perhitungan',
        kv([
          ['Melaporkan biaya Rp 0', trZero+' / '+n],
          ['Nilai di bawah Rp 1.000 <span class="dq">FLAG DQ</span>', trSus.length+' / '+n],
          ['Nilai valid dipakai', trOk.length+' / '+n],
          ['Median biaya transport', trOk.length?rp(med(trOk)):'—'],
          ['Rentang biaya transport', trOk.length?rp(Math.min(...trOk))+' – '+rp(Math.max(...trOk)):'—'],
          ['Biaya transport terhadap nilai GN', tca.length?'median '+dec(med(tca),1)+'%':'—']
        ]),
        (trSus.length? 'Nilai yang ditandai tercatat sebagai '+trSus.sort((a,b)=>a-b).map(nf).join(', ')+
          ' — diduga ditulis dalam satuan ribu rupiah. Nilai ini tidak dikonversi dan tidak dimasukkan ke median sampai satuannya dikonfirmasi.':
          'Tidak ada nilai bertanda satuan meragukan pada seleksi ini.')),
      card('TABEL 6','Kehilangan kesempatan kerja','Basis '+n+' responden',
        hb([{k:'Tidak kehilangan',v:C(R,r=>r.hilang==='Tidak'),cls:'g',lbl:of_(C(R,r=>r.hilang==='Tidak'),n)},
            {k:'Tidak relevan (tidak bekerja)',v:C(R,r=>r.hilang.indexOf('Tidak relevan')===0),cls:'l',
             lbl:of_(C(R,r=>r.hilang.indexOf('Tidak relevan')===0),n)},
            {k:'Ya, kehilangan',v:C(R,r=>r.hilang==='Ya'),lbl:of_(C(R,r=>r.hilang==='Ya'),n)}],{max:n}),
        (hilangRp.length? 'Estimasi pendapatan hilang dari '+hilangRp.length+' RC: median '+
          rp(med(hilangRp))+', rentang '+rp(Math.min(...hilangRp))+'–'+rp(Math.max(...hilangRp))+'. ':'')
        +'Kategori "tidak kehilangan" dan "tidak bekerja" tidak digabung karena artinya berbeda.'),
      card('TABEL 7','Lokasi penerimaan, keamanan, dan perlakuan','Basis '+n+' responden',
        kv(lokD.filter(d=>d.v>0).map(d=>[esc(d.k),d.v+' / '+n]).concat([
          ['Lokasi sesuai informasi awal', C(R,r=>r.lokasiSesuai==='Ya')+' / '+n],
          ['Merasa aman selama proses', C(R,r=>r.aman==='Ya')+' / '+n],
          ['Diperlakukan dengan hormat', C(R,r=>r.hormat==='Ya')+' / '+n]
        ])),
        'Catatan kualitatif observer belum tersedia; kolom naratif Tabel 7 masih kosong.')
    ])
  + row('r-12',[
      card('TABEL 6','Cara penyaluran GN yang dinilai lebih tepat oleh RC',
        'Pilihan tunggal · basis '+n+' responden',
        hb(caraD.map(d=>({k:esc(d.k),v:d.v,cls:(d.k==='Lainnya'||d.k==='Tidak menjawab')?'l':'',
          lbl:of_(d.v,n)})),{max:n}),
        (R.some(r=>r.caraPrefLain)? 'RC yang memilih "Lainnya" menuliskan: '+
          R.filter(r=>r.caraPrefLain).map(r=>esc(r.caraPrefLain)).join(' · ')+'.':'')),
      card('TABEL 6','Cara penyaluran yang dinilai lebih tepat, per AP',
        'Jumlah RC · basis '+n+' responden',caraTbl)
    ]);
}

function pg5(R){
  const n=R.length;
  const PAKAI=['Pangan pokok','Pangan baduta','Air','Kebersihan','Kesehatan (berobat)','Transportasi',
    'Komunikasi','Pendidikan anak','Pakaian','Alas kaki','Penghematan','Bayar utang','Tabungan',
    'Mainan anak','Perabot RT','Listrik','Pulsa','Lainnya'];
  const UNMET=['Pangan dasar','Pangan baduta','Pangan bumil/busui','Air','Kebersihan','Rumah',
    'Kesehatan','Transport','Komunikasi','Pendidikan','Pakaian','Lainnya'];
  const BELANJA=['Toko','Kios/warung','Pasar tradisional','Pusat perbelanjaan','Online','Minimarket',
    'Supermarket','Mall','Lainnya'];
  const KEM=['Semua','Sebagian besar','Setengah','Kurang dari setengah','Tidak ada'];
  const pk=multi(R,'pakai',PAKAI);
  const unmetRows=R.filter(r=>r.unmetAda);
  const um=multi(unmetRows,'unmet',UNMET);
  const bl=multi(R,'belanja',BELANJA);
  const kem=KEM.map(k=>({k:k,v:C(R,r=>r.kemampuan===k)}));
  const terlarangYa=C(R,r=>r.terlarang==='Ya'), terlarangNo=C(R,r=>r.terlarang==='Tidak');
  const domD=dist(R,'dominan');

    {t:'Dipakai untuk pendidikan anak',v:C(R,r=>r.pakai.indexOf('Pendidikan anak')>=0),

      v:C(R,r=>r.kemampuan==='Semua'||r.kemampuan==='Sebagian besar'),b:'dari '+n+' RC'},
    {t:'Anak penerima paling dominan memutuskan',v:C(R,r=>r.dominan==='Anak penerima'),b:'dari '+n+' RC'},
    {t:'Menjawab mudah membelanjakan dana',v:C(R,r=>r.sulitBelanja==='Mudah'),b:'dari '+n+' RC'},
    {t:'Melaporkan pembelian rokok / kosmetik / alkohol',v:terlarangYa,b:'dari '+n+' RC'}

  + row('r-21',[
      card('TABEL 8','Kategori penggunaan dana GN',

        hb(pk.filter(x=>x.v>0).map(x=>({k:esc(x.k),v:x.v,cls:x.k==='Lainnya'?'l':''})).concat(
          pk.filter(x=>x.v===0).length?[{k:pk.filter(x=>x.v===0).map(x=>x.k).join(' · '),v:0,lbl:'0'}]:[]),
          {tight:true}),
        (R.some(r=>r.pakaiLain)? 'Isian "Lainnya": '+
          R.filter(r=>r.pakaiLain).map(r=>esc(r.pakaiLain)).join(' · ')+'.':'')),
      card('TABEL 8','Sejauh mana dana GN memenuhi kebutuhan dasar RT',
        'Pilihan tunggal · basis '+n+' responden',
        hb(kem.map((d,ix)=>({k:d.k,v:d.v,cls:ix===2?'l':(ix===3?'ll':(ix===4?'dk':'')),
          lbl:of_(d.v,n)})),{max:n}))
    ])
  + row('r-3',[
      card('TABEL 8','Kebutuhan dasar yang tidak dapat dipenuhi',
        'Multi-respons · basis '+unmetRows.length+' RC yang menjawab bagian ini',
        unmetRows.length? hb(um.filter(x=>x.v>0).map(x=>({k:esc(x.k),v:x.v,cls:x.k==='Lainnya'?'l':''})).concat(
          um.filter(x=>x.v===0).length?[{k:um.filter(x=>x.v===0).map(x=>x.k).join(' · '),v:0,lbl:'0'}]:[]),
          {tight:true}) : '<div class="empty" style="padding:20px">Tidak ada RC yang mengisi bagian ini.</div>',
        (n-unmetRows.length)+' RC tidak mengisi bagian ini, sehingga penyebutnya '+unmetRows.length+', bukan '+n+
        (Object.keys(umAl).length? '. Alasan yang dipilih: '+Object.keys(umAl).map(k=>k.toLowerCase()+' ('+umAl[k]+')').join(', '):'')+'.'),
      card('TABEL 8','Pembelian rokok, kosmetik, atau minuman beralkohol',
        'Pertanyaan sensitif · basis '+n+' responden',
        donut(terlarangYa,terlarangNo,'Ya','Tidak','melaporkan Ya'),
        'Angka ini adalah <b>laporan mandiri responden</b>, dibaca sebagai "jumlah yang dilaporkan", bukan "jumlah yang terjadi". Pada pertanyaan dengan norma sosial kuat, pelaporan cenderung lebih rendah dari kejadian.'),
      card('TABEL 8','Keputusan penggunaan dan tempat belanja',
        'Basis '+n+' responden · tempat belanja multi-respons',
        kv(domD.filter(d=>d.v>0).slice(0,4).map(d=>[esc(d.k)+' memutuskan',d.v+' / '+n]).concat([
          ['Prioritas penggunaan: anak di bawah 18 tahun', C(R,r=>r.prioritas==='Anak <18 tahun')+' / '+n]
        ]).concat(bl.filter(x=>x.v>0).slice(0,4).map(x=>['Belanja di '+x.k.toLowerCase(),x.v+' / '+n])).concat([
          ['Menyatakan harga barang naik', C(R,r=>r.harga==='Naik')+' / '+n],
          ['Menyatakan barang langka', C(R,r=>r.sedia==='Langka')+' / '+n]
        ])))
    ])
  + row('r-1',[card('TABEL 8','Kebutuhan yang ingin dibeli tetapi tidak diperbolehkan aturan',
      C(R,r=>r.batasan==='Ya')+' dari '+n+' RC menjawab Ya · daftar kebutuhan yang disebut',

      'Daftar disusun dari isian teks responden apa adanya. Tidak ada pengelompokan tematik yang dilakukan.')]);

function pg6(R){

  const bdSama=BD.map(([lbl,key])=>lbl.split(' ')[0].toLowerCase()+' '+C(L,r=>r[key]==='Sama')).join(', ');
  const BO=['Modalitas CVP (sekarang)','Sama saja','Modalitas lama (barang dari staff)','Tidak yakin'];

  return kpi([

        '<div style="margin-top:12px">'+bantuanTbl+'</div>',
        (R.some(r=>r.bantuanDetail)? 'Bentuk bantuan yang disebut: '+
          R.filter(r=>r.bantuanDetail).map(r=>esc(r.bantuanDetail)).join(' · ')+'.':''))
    ])
  + '<div class="note"><b>Basis bagian perbandingan modalitas adalah '+m+' RC</b>, yaitu responden yang pernah menerima GN dengan metode lama sebelum 2025. Pertanyaan ini tidak ditanyakan ke '+(n-m)+' RC lainnya, sehingga penyebutnya bukan '+n+'.</div>'
  + (m? row('r-12',[

        'Basis '+m+' RC yang pernah menerima modalitas lama',

        'Sisanya menjawab "sama": '+bdSama+'. Tidak ada RC yang menilai dimensi apa pun lebih buruk.'),

        (L.some(r=>r.bAlasan)? 'Contoh alasan yang disampaikan RC: '+

        '<div class="empty">Tidak ada RC pada seleksi ini yang pernah menerima GN modalitas lama, sehingga bagian ini kosong.</div>')]));
}

/* distribusi nilai numerik -> bar (mis. ukuran RT, jumlah anak) */
function numBars(vals,unit,base){
  return [...new Set(vals)].sort((x,y)=>x-y).map(k=>{
    const v=vals.filter(x=>x===k).length;
    return {k:k+' '+unit,v:v,lbl:of_(v,base)};
  });

  const ua=R.map(r=>r.usiaAnak).filter(v=>v!=null);
  const uaBars=UKEL.map(([l,lo,hi])=>{
    const v=C(R,r=>r.usiaAnak!=null && r.usiaAnak>=lo && r.usiaAnak<=hi);
    return {k:l,v:v,lbl:of_(v,n)};
  });
  const skBars=SEKOLAH.map(([k,l])=>{
    const v=C(R,r=>r.sekolah===k);
    return {k:l,v:v,cls:(k==='Putus Sekolah'?'dk':''),lbl:of_(v,n)};
  });
  const sekNA=C(R,r=>!r.sekolah);

  /* --- responden & kepala keluarga --- */
  const rP=C(R,r=>r.jkResp==='Perempuan'), rL=C(R,r=>r.jkResp==='Laki-laki');
  const kP=C(R,r=>r.jkKk==='Perempuan'),  kL=C(R,r=>r.jkKk==='Laki-laki');
  const ur=R.map(r=>r.usiaResp).filter(v=>v!=null);
  const uk=R.map(r=>r.usiaKk).filter(v=>v!=null);
  const jkBars=[
    {k:'Responden \u2014 Perempuan',v:rP,lbl:of_(rP,n)},
    {k:'Responden \u2014 Laki-laki',v:rL,cls:'l',lbl:of_(rL,n)},
    {k:'Kepala keluarga \u2014 Perempuan',v:kP,cls:'dk',lbl:of_(kP,n)},
    {k:'Kepala keluarga \u2014 Laki-laki',v:kL,cls:'ll',lbl:of_(kL,n)}
  ];

  /* --- hubungan responden dengan KK (pengambil keputusan rumah tangga) --- */
  const hSelf=C(R,r=>r.isKk==='Ya');
  const hMap={};
  R.filter(r=>r.isKk!=='Ya').forEach(r=>{
    const k=r.hubKk || 'Tidak diisi (skip logic)';
    hMap[k]=(hMap[k]||0)+1;
  });
  const hubBars=[{k:'Kepala keluarga (responden sendiri)',v:hSelf,cls:'dk',lbl:of_(hSelf,n)}]
    .concat(Object.keys(hMap).sort((a,b)=>hMap[b]-hMap[a]).map(k=>({
      k:esc(k),v:hMap[k],
      cls:(k.indexOf('Tidak diisi')===0?'g':''),
      lbl:of_(hMap[k],n)})));
  const hubNA=Object.keys(hMap).filter(k=>k.indexOf('Tidak diisi')===0)
    .reduce((a,k)=>a+hMap[k],0);

  /* --- pendidikan KK --- */
  const pdBars=PENDKK.map(k=>{
    const v=C(R,r=>r.pendKk===k);
    return {k:k,v:v,cls:(k==='Tidak/belum sekolah'?'dk':''),lbl:of_(v,n)};
  });
  const pdLow=C(R,r=>r.pendKk==='Tidak/belum sekolah'||r.pendKk==='SD');

  /* --- rumah tangga --- */
  const tot=R.map(r=>r.anggota).filter(v=>v!=null);
  const a18=R.map(r=>r.angg018).filter(v=>v!=null);
  const adw=R.map(r=>r.anggDws).filter(v=>v!=null);
  const hamil=C(R,r=>r.anggHamil>0);
  /* DQ: jumlah anggota berpenghasilan > jumlah anggota dewasa (>18) \u2192 tidak plausibel */
  const keOk=R.filter(r=>r.anggKerja!=null && r.anggDws!=null && r.anggKerja<=r.anggDws)
              .map(r=>r.anggKerja);
  const keDq=C(R,r=>r.anggKerja!=null && r.anggDws!=null && r.anggKerja>r.anggDws);
  const rmBars=RUMAHST.map(k=>{
    const v=C(R,r=>r.rumah===k);
    return {k:k,v:v,cls:(k==='Lainnya'?'l':(k==='Menumpang'?'dk':'')),lbl:of_(v,n)};
  });

  /* --- inklusi & disabilitas --- */
  const dRow=R.filter(r=>r.disab==='Ya'), dYa=dRow.length;
  const dTdk=C(R,r=>r.disab==='Tidak');
  /* penyebut = RT disabilitas (sangat kecil) \u2192 label angka absolut, bukan persen */
  const dBars=DISJEN.map(k=>{
    const v=dRow.filter(r=>(r.disJenis||[]).indexOf(k)>=0).length;
    return {k:k,v:v,lbl:String(v)};
  });

  /* ---------- KPI ---------- */
  const K=kpi([
    {t:'Responden (RC)',v:n,b:'RC terwawancara pada seleksi ini'},
    {t:'Median usia anak',v:(ua.length?dec(med(ua),1):'\u2014')+'<span class="u"> th</span>',
      b:'rentang '+rng(ua)+' th \u00b7 basis '+ua.length+' RC'},
    {t:'Anak perempuan',v:aP,b:pctS(aP,n)+' dari '+n+' RC'},
    {t:'Responden perempuan',v:rP,b:pctS(rP,n)+' dari '+n+' RC'},
    {t:'RT dengan anggota disabilitas',v:dYa,b:pctS(dYa,n)+' dari '+n+' RC'}
  ]);

  /* ---------- 10 kartu demografi, 2 kolom ---------- */
  const G=[
    card(null,'Jenis kelamin anak penerima','Basis '+n+' anak penerima GN',
      donut(aP,aL,
        'Perempuan <em>('+pctS(aP,n)+')</em>',
        'Laki-laki <em>('+pctS(aL,n)+')</em>',
        'Anak perempuan'),null),

    card(null,'Kelompok usia anak penerima',
      'Median '+(ua.length?dec(med(ua),1):'\u2014')+' th \u00b7 rentang '+rng(ua)+' th',
      hb(uaBars,{max:n}),null),

    card(null,'Status sekolah anak saat ini',
      'Urutan jenjang'+(sekNA?' \u00b7 <span class="dq">'+sekNA+' tanpa jawaban</span>':''),
      hb(skBars,{max:n,tight:true}),null),

    card(null,'Jumlah anak usia 0\u201318 tahun dalam RT',
      'Rata-rata '+(a18.length?dec(avg(a18),1):'\u2014')+' anak per RT',
      hb(numBars(a18,'anak',n),{max:n,tight:true}),null),

    card(null,'Hubungan responden dengan kepala keluarga',
      'Pengambil keputusan rumah tangga'+
      (hubNA?' \u00b7 <span class="dq">'+hubNA+' bukan KK tapi hubungan kosong</span>':''),
      hb(hubBars,{max:n}),null),

    card(null,'Jenis kelamin responden &amp; kepala keluarga',
      'Median usia responden '+(ur.length?dec(med(ur),0):'\u2014')+' th \u00b7 median usia KK '+
      (uk.length?dec(med(uk),0):'\u2014')+' th',
      hb(jkBars,{max:n}),null),

    card(null,'Pendidikan terakhir kepala keluarga',
      pdLow+' dari '+n+' RC \u2014 KK berpendidikan SD atau lebih rendah ('+pctS(pdLow,n)+')',
      hb(pdBars,{max:n}),null),

    card(null,'Ukuran rumah tangga',
      'Rata-rata '+(tot.length?dec(avg(tot),1):'\u2014')+' anggota per RT',
      stat([
        {v:(tot.length?dec(avg(tot),1):'\u2014'),t:'Rata-rata anggota RT'},
        {v:(a18.length?dec(avg(a18),1):'\u2014'),t:'Rata-rata anggota usia 0\u201318 th'},
        {v:(adw.length?dec(avg(adw),1):'\u2014'),t:'Rata-rata anggota usia >18 th'}
      ])+hb(numBars(tot,'orang',n),{max:n,tight:true}),null),

    card(null,'Status tempat tinggal',
      'Kepemilikan rumah yang ditempati RC',
      hb(rmBars,{max:n}),null),

    card(null,'Inklusi &amp; disabilitas',
      'Jenis kebutuhan khusus memakai angka absolut \u2014 penyebut hanya '+dYa+' RT',
      stat([
        {v:dYa,t:'RT dengan anggota disabilitas'},
        {v:pctS(dYa,n),t:'Proporsi dari '+n+' RC'},
        {v:dTdk,t:'RT tanpa anggota disabilitas'}
      ])+hb(dBars,{max:Math.max(1,dYa),tight:true}),null)
  ];

  /* ---------- tabel demografi per AP (untuk tindak lanjut lapangan) ---------- */
  const apBody=byAp(R).map(([a,rr])=>{
    const nn=rr.length;
    const p=C(rr,r=>r.jkAnak==='Perempuan');
    const u=rr.map(r=>r.usiaAnak).filter(v=>v!=null);
    const g=rr.map(r=>r.anggota).filter(v=>v!=null);
    return '<tr><td>'+esc(a)+'</td>'+
      '<td class="n">'+nn+'</td>'+
      '<td class="n">'+p+'</td>'+
      '<td class="n">'+(nn-p)+'</td>'+
      '<td class="n">'+(u.length?dec(med(u),1):'\u2014')+'</td>'+
      '<td class="n">'+C(rr,r=>r.pendKk==='Tidak/belum sekolah'||r.pendKk==='SD')+'</td>'+
      '<td class="n">'+C(rr,r=>r.rumah==='Milik sendiri')+'</td>'+
      '<td class="n">'+C(rr,r=>r.disab==='Ya')+'</td>'+
      '<td class="n">'+(g.length?dec(avg(g),1):'\u2014')+'</td></tr>';
  }).join('');
  const apCard=card('Tabel A','Profil demografi per Area Program',
    'Angka absolut (n per AP kecil) \u00b7 median usia anak dan rata-rata anggota RT dalam desimal',
    tbl('<tr><th>Area Program</th><th class="n">RC</th><th class="n">Anak<br>P</th>'+
        '<th class="n">Anak<br>L</th><th class="n">Median usia<br>anak (th)</th>'+
        '<th class="n">KK \u2264 SD</th><th class="n">Rumah milik<br>sendiri</th>'+
        '<th class="n">RT<br>disabilitas</th><th class="n">Rata-rata<br>anggota RT</th></tr>',
        apBody),null);

  /* catatan DQ khusus anggota berpenghasilan \u2014 dipisah agar tidak mengotori kartu */
  const dqBox = keDq ?
    '<div class="note"><b>Catatan kualitas data.</b> Kolom <i>jumlah anggota keluarga yang '+
    'berpenghasilan</i> tidak dipakai sebagai indikator pada halaman ini: <b>'+keDq+' dari '+n+
    ' record</b> mencatat jumlah berpenghasilan melebihi jumlah anggota usia &gt;18 tahun '+
    '(pola pengisian = total anggota RT). Rata-rata pada record yang lolos uji: '+
    (keOk.length?dec(avg(keOk),1):'\u2014')+' orang (basis '+keOk.length+' RC). '+
    'Perlu verifikasi lapangan sebelum dilaporkan.</div>' : '';

  return K + '<div class="cv-grid">'+G.join('')+'</div>' + row('r-1',[apCard]) + dqBox;
}

/* ikon menu: inline SVG. Atribut width/height/fill/stroke ditulis langsung pada
   elemen svg agar ikon tetap benar walau CSS belum termuat. */
const ICO={
  cover:'<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/></svg>',
  grid :'<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>',
  users:'<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 19v-1a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v1"/><circle cx="9" cy="7" r="3.2"/><path d="M22 19v-1a4 4 0 0 0-3-3.87"/><path d="M16.5 4.2a3.2 3.2 0 0 1 0 5.6"/></svg>',
  info :'<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 8h.01"/></svg>',
  bank :'<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10 12 4l9 6"/><path d="M5 10v9"/><path d="M19 10v9"/><path d="M3 20h18"/><path d="M10 20v-6h4v6"/></svg>',
  truck:'<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="12" height="9" rx="1"/><path d="M14 10h4l3 3v3h-7z"/><circle cx="6.5" cy="18" r="1.8"/><circle cx="17" cy="18" r="1.8"/></svg>',
  wallet:'<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10.5h18"/><path d="M16.5 14.8h.01"/></svg>',
  smile:'<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.2a4.4 4.4 0 0 0 7 0"/><path d="M9 9.5h.01"/><path d="M15 9.5h.01"/></svg>',
  shield:'<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.2 7.6-8 9-4.8-1.4-8-4.5-8-9V6z"/><path d="M8.8 12.2l2.3 2.3 4.1-4.6"/></svg>'
};

/* [id, label menu, H1, sub-judul, fungsi render, ikon] */
const PAGES=[
 ['p0','Cover',null,null,cover,ICO.cover],
 ['p1','Overview','Overview','Ringkasan 6 area asesmen',pg1,ICO.grid],
 ['pd','Demografi','Demografi Responden &amp; Rumah Tangga','Profil anak penerima, responden, kepala keluarga, dan rumah tangga',page_demografi,ICO.users],
 ['p2','Informasi','Area 1 \u2014 Penyediaan Informasi','Tabel 1 &amp; 2',pg2,ICO.info],
 ['p3','Kinerja FSP','Area 2 \u2014 Kinerja Penyedia Jasa Keuangan (FSP)','Tabel 3 &amp; 4',pg3,ICO.bank],
 ['p4','Distribusi','Area 3 \u2014 Proses Distribusi','Tabel 5, 6 &amp; 7',pg4,ICO.truck],
 ['p5','Penggunaan','Area 4 \u2014 Penggunaan Dana','Tabel 8',pg5,ICO.wallet],
 ['p6','Kepuasan','Area 5 \u2014 Kepuasan &amp; Perbandingan Modalitas','Tabel 9',pg6,ICO.smile],
 ['p7','Akuntabilitas','Area 6 \u2014 Akuntabilitas','Tabel 11',pg7,ICO.shield]
];
const COVER_ID='p0';
let current=COVER_ID;

/* sembunyikan kotak filter sepenuhnya saat tab Cover aktif */
function syncChrome(){
  $('fbar').hidden = (current===COVER_ID);
  if(current===COVER_ID) openSlicer=null;   // dropdown ikut tertutup
}
function render(){
  buildFilters();
  const R=filtered();
  const selTxt = (state.ap.size ? [...state.ap].join(', ') : 'semua AP')
    + (state.fsp.size  ? ' \u00b7 FSP: '+[...state.fsp].join(', ') : '')
    + (state.lama.size ? ' \u00b7 modalitas lama: '+[...state.lama].join('/') : '');
  $('pages').innerHTML = PAGES.map(([id,,h1,sub,fn])=>{
    const isCover = (id===COVER_ID);
    const head = isCover ? '' :
      '<div class="top"><div><h1>'+h1+'</h1><div class="sub">'+sub+' \u00b7 '+esc(selTxt)+
      ' \u00b7 '+R.length+' RC</div></div></div>';
    const body = (isCover || R.length) ? fn(R) :
      '<div class="empty"><b>Tidak ada responden pada kombinasi filter ini.</b><br>Longgarkan salah satu filter di atas atau tekan "Bersihkan filter".</div>';
    return '<section class="pg'+(isCover?' pg-cover':'')+(id===current?' on':'')+
      '" id="'+id+'">'+head+body+'</section>';
  }).join('');
  syncChrome();
}
function go(id){
  current=id;
  document.querySelectorAll('.pg').forEach(s=>s.classList.toggle('on',s.id===id));
  document.querySelectorAll('#nav button').forEach(b=>b.setAttribute('aria-current',String(b.dataset.p===id)));
  syncChrome();
  window.scrollTo({top:0,behavior:'smooth'});
}
PAGES.forEach(([id,label,,,,icon])=>{
  const b=document.createElement('button');
  b.innerHTML=(icon||'')+'<span>'+label+'</span>';
  b.dataset.p=id;
  b.setAttribute('aria-current',String(id===COVER_ID));
  b.addEventListener('click',()=>go(id));
  $('nav').appendChild(b);
});
$('slicers').addEventListener('click',onSlicerClick);
$('slicers').addEventListener('change',onSlicerChange);
$('f-reset').addEventListener('click',()=>{resetFilters();render();});
render();
</script>
